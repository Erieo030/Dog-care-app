services:
  mongo:
    image: mongo:7
    container_name: app-mongo
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-erieo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-erieo030}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-app_dog_db}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ping:1})'"]
      interval: 5s
      timeout: 15s
      retries: 10
      start_period: 15s

  mongo-express:
    image: mongo-express
    container_name: mongo-ui
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      TZ: Asia/Taipei
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USERNAME:-erieo}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-erieo030}
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

volumes:
  mongo_data:
